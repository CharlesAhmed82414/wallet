name: Bug report
description: Report something that is broken or behaves differently than expected
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file this. Please do not include seed phrases,
        private keys or any other secret in this report.
  - type: textarea
    id: what-did
    attributes:
      label: What did you do?
      description: The steps you took, in order.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened instead?
      description: The actual behaviour, including any error text.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - iOS
        - Android
        - Both
        - Rust core / CLI
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version or commit
      description: The build number from the app, or the commit you built from.
    validations:
      required: false
